<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield background -->
  <path d="M 100 10 L 160 40 L 160 100 Q 100 160 100 160 Q 100 160 40 100 L 40 40 Z" fill="#001A4D" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Inner circle (Ashoka Chakra) -->
  <circle cx="100" cy="85" r="35" fill="white" stroke="#FFD700" stroke-width="1"/>
  <circle cx="100" cy="85" r="28" fill="none" stroke="#001A4D" stroke-width="1"/>
  
  <!-- Chakra spokes -->
  <g stroke="#001A4D" stroke-width="0.8">
    <line x1="100" y1="57" x2="100" y2="113"/>
    <line x1="72" y1="85" x2="128" y2="85"/>
    <line x1="78" y1="61" x2="122" y2="109"/>
    <line x1="122" y1="61" x2="78" y2="109"/>
  </g>
  
  <!-- Laurel wreaths (left and right) -->
  <path d="M 60 50 Q 50 60 55 75" fill="none" stroke="#FFD700" stroke-width="2"/>
  <path d="M 140 50 Q 150 60 145 75" fill="none" stroke="#FFD700" stroke-width="2"/>
  
  <!-- GUJARAT POLICE text -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFD700">
    GUJARAT POLICE
  </text>
  
  <!-- Suraksha (Security) text in Gujarati -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#FFD700">
    સુરક્ષા
  </text>
</svg>