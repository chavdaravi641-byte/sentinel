# Sentinel AI edge media server (MediaMTX) configuration.
#
# Serves as the HLS + WebRTC fan-out for the Phase 2 streaming engine.
# The API's per-camera ffmpeg ingest publishes RTSP here; browsers consume
# HLS/MJPEG through the FastAPI proxy and WebRTC through the WHEP relay.

logLevel: info

# RTSP ingest (API -> mediamtx)
rtsp: true
rtspAddress: :8554

# HLS out (mediamtx -> API proxy -> browser) — low latency fmp4
hls: true
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsPartDuration: 200ms
hlsSegmentCount: 7
hlsSegmentDuration: 1s

# RTSPS is disabled in the reproducible demo because no certificate is mounted.
# Production deployments should provide certificates and enable optional TLS.
rtspsAddress: :8322
rtspEncryption: "no"

# WebRTC out (WHEP) with ICE for NAT traversal
webrtc: true
webrtcAddress: :8889
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# Path defaults: accept any publisher/reader without credentials (internal net).
paths:
  all_others: